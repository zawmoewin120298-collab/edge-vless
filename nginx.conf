worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    keepalive_timeout 120s;
    keepalive_requests 1000;

    upstream xray_ws {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _; # အားလုံးကို လက်ခံမည်

        # အစ်ကို့ရဲ့ Link ပါ Path နှင့် ကွက်တိ ချိန်ညှိခြင်း
        location /www.speedtest.net {
            proxy_redirect off;
            proxy_pass http://xray_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host "www.speedtest.net"; # Host အသေ သတ်မှတ်ပေးခြင်း
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ကျန်တဲ့ လမ်းကြောင်းမရှိသမျှကို ပိတ်ချရန်
        location / {
            return 404;
        }
    }
}
