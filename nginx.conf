worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 🚀 CDN Keepalive Tuning
    keepalive_timeout 120s;
    keepalive_requests 1000;

    # 🌐 Backend Xray Pools
    upstream xray_ws {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    upstream xray_grpc {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    upstream xray_httpupgrade {
        server 127.0.0.1:8082;
        keepalive 64;
    }

    upstream xray_xhttp {
        server 127.0.0.1:8083;
        keepalive 64;
    }

    upstream xray_h2 {
        server 127.0.0.1:8084;
        keepalive 64;
    }

    # 🎛️ Main Proxy Engine
    server {
        listen 80;
        server_name localhost;

        # Proxy Templates
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1️⃣ WebSocket (Default Catch-All to WebSocket)
        # အစ်ကို့ရဲ့ Cloudflare က Path * နဲ့ လာသမျှကို ဒိုင်ခံ လက်ခံပြီး Port 8080 ဆီ ပို့ပေးပါမည်
        location / {
            proxy_redirect off;
            proxy_pass http://xray_ws;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 2️⃣ gRPC Path
        location /www.speedtest.net/Tun {
            if ($request_method = 'POST') {
                grpc_pass grpc://xray_grpc;
            }
        }

        # 3️⃣ HTTPUpgrade Path
        location /httpupgrade-path {
            proxy_redirect off;
            proxy_pass http://xray_httpupgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 4️⃣ XHTTP Path
        location /xhttp-path {
            proxy_redirect off;
            proxy_pass http://xray_xhttp;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 5️⃣ Native HTTP/2 (H2) Path
        location /h2-path {
            proxy_pass http://xray_h2;
        }
    }
}
