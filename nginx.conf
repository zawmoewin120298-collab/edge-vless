worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 🚀 Keep connections to CDN alive (အစ်ကို့ရဲ့ Keepalive Tuning)
    keepalive_timeout 120s;
    keepalive_requests 1000;

    # 🌐 Upstream Pools (Connection Pool 64 ခုစီဖြင့် Backend ကို အမြန်ဆုံး ချိတ်ဆက်ပေးမည့်နေရာ)
    upstream v2ray_ws {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    upstream v2ray_grpc {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    upstream v2ray_httpupgrade {
        server 127.0.0.1:8082;
        keepalive 64;
    }

    upstream v2ray_xhttp {
        server 127.0.0.1:8083;
        keepalive 64;
    }

    upstream v2ray_h2 {
        server 127.0.0.1:8084;
        keepalive 64;
    }

    upstream v2ray_tcp {
        server 127.0.0.1:8086;
        keepalive 64;
    }

    # 🎛️ ပင်မ Reverse Proxy Server (Port 80 ကနေ အဝင်လက်ခံမည်)
    server {
        listen 80;
        server_name localhost;

        # Standard Proxy Headers Setting (Template)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ၁။ WebSocket Path (Port 8080)
        location /www.speedtest.net {
            proxy_redirect off;
            proxy_pass http://v2ray_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ၂။ gRPC Path (Port 8081) - Xray/V2Ray Core Standard gRPC Service Name Path
        location /www.speedtest.net/Tun {
            if ($request_method = 'POST') {
                grpc_pass grpc://v2ray_grpc;
            }
        }

        # ၃။ HTTPUpgrade Path (Port 8082)
        location /httpupgrade-path {
            proxy_redirect off;
            proxy_pass http://v2ray_httpupgrade;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ၄။ XHTTP Path (Port 8083)
        location /xhttp-path {
            proxy_redirect off;
            proxy_pass http://v2ray_xhttp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ၅။ Native HTTP/2 (H2) Path (Port 8084)
        location /h2-path {
            proxy_pass http://v2ray_h2;
            proxy_http_version 1.1;
        }

        # ၆။ Fake HTTP GET / RAW TCP (Port 8086)
        location / {
            proxy_pass http://v2ray_tcp;
            proxy_http_version 1.1;
        }
    }
}
